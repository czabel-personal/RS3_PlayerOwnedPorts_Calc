<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Crew Optimizer</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="/static/indexStyles.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <div class="header-brand">
                <h1 class="header-title">Ship Crew Optimizer</h1>
            </div>
            <div class="header-status">
                <span id="api-status" class="status-indicator">
                    <span class="status-dot yellow animate-pulse"></span>
                    <span class="status-text gray">Connecting...</span>
                </span>
                <button id="btn-refresh" class="btn btn-cyan">
                    Refresh
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Top Grid: Roster Actions + Voyage Section side-by-side -->
        <div class="top-grid">
            <!-- Roster Actions Panel (25% width, on the left) -->
            <div class="panel roster-actions-section">
                <div class="panel-header">
                    <h2 class="panel-title">Roster Actions</h2>
                </div>
                <div class="panel-body">
                    <div class="actions-row">
                        <button id="btn-save-roster" class="btn btn-cyan">
                            Save Roster
                        </button>
                        <button id="btn-load-roster" class="btn btn-blue">
                            Load Roster
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Player Owned Ports Voyages -->
            <div class="panel voyage-section">
                <div class="panel-header">
                    <h2 class="panel-title">Player Owned Ports Voyages</h2>
                </div>
                <div class="panel-body">
                    <div class="voyage-grid">
                        <!-- Left Column: Voyage Targets -->
                        <div class="voyage-column">
                            <div class="input-row">
                                <label class="font-medium text-gray-300">Morale Target</label>
                                <input type="text" id="morale-target" class="bg-navy-900 border border-navy-600 rounded px-3 py-2 text-gray-100 focus:outline-none focus:border-cyan-500" placeholder="300">
                            </div>
                            <div class="input-row">
                                <label class="font-medium text-gray-300">Combat Target</label>
                                <input type="text" id="combat-target" class="bg-navy-900 border border-navy-600 rounded px-3 py-2 text-gray-100 focus:outline-none focus:border-cyan-500" placeholder="250">
                            </div>
                            <div class="input-row">
                                <label class="font-medium text-gray-300">Seafaring Target</label>
                                <input type="text" id="seafaring-target" class="bg-navy-900 border border-navy-600 rounded px-3 py-2 text-gray-100 focus:outline-none focus:border-cyan-500" placeholder="180">
                            </div>
                        </div>
                        <!-- Center-Left Column: Consumables -->
                        <div class="voyage-column">
                            <div class="input-row">
                                <label class="font-medium text-gray-300">Ration Pack</label>
                                <select id="ration-pack" class="bg-navy-900 border border-navy-600 rounded px-3 py-2 text-gray-100 focus:outline-none focus:border-cyan-500">
                                    <option value="">None</option>
                                    <option value="1">1 (+10% morale)</option>
                                    <option value="2">2 (+20% morale)</option>
                                    <option value="3">3 (+30% morale)</option>
                                </select>
                            </div>
                            <div class="input-row">
                                <label class="font-medium text-gray-300">Powder Keg</label>
                                <select id="powder-keg" class="bg-navy-900 border border-navy-600 rounded px-3 py-2 text-gray-100 focus:outline-none focus:border-cyan-500">
                                    <option value="">None</option>
                                    <option value="1">1 (+10% combat)</option>
                                    <option value="2">2 (+20% combat)</option>
                                    <option value="3">3 (+30% combat)</option>
                                </select>
                            </div>
                            <div class="input-row">
                                <label class="font-medium text-gray-300">Bottled Cry</label>
                                <select id="bottled-cry" class="bg-navy-900 border border-navy-600 rounded px-3 py-2 text-gray-100 focus:outline-none focus:border-cyan-500">
                                    <option value="">None</option>
                                    <option value="1">1 (+10% seafaring)</option>
                                    <option value="2">2 (+20% seafaring)</option>
                                    <option value="3">3 (+30% seafaring)</option>
                                </select>
                            </div>
                        </div>
                        <!-- Right Column: Optimize Button -->
                        <div class="voyage-button-col">
                            <button id="btn-optimize" class="btn btn-optimize">
                                Optimize Crew Assignment
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Grid: Ships | Captains | Crew row, then Results below -->
        <div class="main-grid">
            
            <!-- Ships Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Ships</h2>
                </div>
                <div class="panel-body">
                    <div class="ship-slots-column" id="ship-slots-container">
                        <!-- Ship slots will be rendered here -->
                    </div>
                </div>
            </div>

            <!-- Captains Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Captains</h2>
                </div>
                <div id="captains-list" class="card-list panel-body">
                    <!-- Captain slots will be rendered here -->
                </div>
            </div>

            <!-- Crew Panel -->
            <div class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Crew</h2>
                </div>
                <div id="crew-list" class="card-list panel-body">
                    <!-- Crew slots will be rendered here -->
                </div>
            </div>

        </div>
        
        <!-- Full Width: Optimization Results (below the row) -->
        <div class="results-row">
            <div class="panel full-width-panel">
                <div class="panel-header results-header">
                    <h2 class="panel-title">Optimization Results</h2>
                    <span id="result-count" class="result-count">0 results</span>
                </div>
                <div id="results-list" class="results-list panel-body">
                    <div class="empty-state">
                        <svg class="mx-auto h-12 w-12 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        <p class="mt-2">Run optimization to see results</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <span id="loading-text" class="text-gray-100">Processing...</span>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Traits Modal -->
    <div id="traits-modal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3 class="modal-title">Select Traits</h3>
                <button class="modal-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <div class="traits-dropdowns-column">
                    <div class="traits-dropdown-item">
                        <label class="traits-dropdown-label">Trait Slot 1:</label>
                        <select class="traits-dropdown-select" data-slot="0">
                            <option value="">None</option>
                            <option value="Leader">Leader (+1% Morale)</option>
                            <option value="Tactician">Tactician (+1% Combat)</option>
                            <option value="Seafriend">Seafriend (+1% Seafaring)</option>
                        </select>
                    </div>
                    <div class="traits-dropdown-item">
                        <label class="traits-dropdown-label">Trait Slot 2:</label>
                        <select class="traits-dropdown-select" data-slot="1">
                            <option value="">None</option>
                            <option value="Leader">Leader (+1% Morale)</option>
                            <option value="Tactician">Tactician (+1% Combat)</option>
                            <option value="Seafriend">Seafriend (+1% Seafaring)</option>
                        </select>
                    </div>
                    <div class="traits-dropdown-item">
                        <label class="traits-dropdown-label">Trait Slot 3:</label>
                        <select class="traits-dropdown-select" data-slot="2">
                            <option value="">None</option>
                            <option value="Leader">Leader (+1% Morale)</option>
                            <option value="Tactician">Tactician (+1% Combat)</option>
                            <option value="Seafriend">Seafriend (+1% Seafaring)</option>
                        </select>
                    </div>
                    <div class="traits-dropdown-item">
                        <label class="traits-dropdown-label">Trait Slot 4:</label>
                        <select class="traits-dropdown-select" data-slot="3">
                            <option value="">None</option>
                            <option value="Leader">Leader (+1% Morale)</option>
                            <option value="Tactician">Tactician (+1% Combat)</option>
                            <option value="Seafriend">Seafriend (+1% Seafaring)</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="traits-save-btn" class="btn btn-cyan">Done</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state - will be overwritten by API config
        let MAX_CAPTAIN_SLOTS = 5;
        let MAX_CREW_SLOTS = 10;
        let CREW_TYPES = ['Guard', 'Gunner', 'Sailor', 'Scholar', 'Steward', 'Laborer'];
        let rosterData = { captains: [], crew: [] };
        let ships = [];
        let optimizationResults = [];

        // API base URL
        const API_BASE = window.location.origin;

        // Initialize the application
        $(document).ready(function() {
            loadAppConfig();
        });

        // Render ship slots with new layout
        function renderShips() {
            let html = '';
            
            for (let i = 0; i < 4; i++) {
                const ship = ships[i] || { ship_name: '', ram_figurehead: '', deck1: '', deck2: '', hull: '' };
                
                html += `
                    <div class="ship-slot-card" data-slot="${i}">
                        <div class="ship-slot-header">
                            <label class="ship-slot-title">Ship ${i + 1}:</label>
                            <input type="text" class="ship-name-input ship-slot-input"
                                   placeholder="Enter ship name..." value="${ship.ship_name || ''}"
                                   data-slot="${i}" data-field="ship_name">
                        </div>
                        <div class="ship-slot-body ${ship.ship_name && ship.ship_name.trim() !== '' ? '' : 'disabled'}">
                            <div class="ship-equipment-row">
                                <div class="ship-stat-group">
                                    <label class="ship-stat-label">Bow</label>
                                    <input type="text" class="ship-equipment-input ship-slot-input"
                                           placeholder="Item..." value="${ship.ram_figurehead || ''}"
                                           data-slot="${i}" data-field="ram_figurehead"
                                           ${ship.ship_name && ship.ship_name.trim() !== '' ? '' : 'disabled'}>
                                </div>
                                <div class="ship-stat-group">
                                    <label class="ship-stat-label">Deck 1</label>
                                    <input type="text" class="ship-equipment-input ship-slot-input"
                                           placeholder="Item..." value="${ship.deck1 || ''}"
                                           data-slot="${i}" data-field="deck1"
                                           ${ship.ship_name && ship.ship_name.trim() !== '' ? '' : 'disabled'}>
                                </div>
                                <div class="ship-stat-group">
                                    <label class="ship-stat-label">Deck 2</label>
                                    <input type="text" class="ship-equipment-input ship-slot-input"
                                           placeholder="Item..." value="${ship.deck2 || ''}"
                                           data-slot="${i}" data-field="deck2"
                                           ${ship.ship_name && ship.ship_name.trim() !== '' ? '' : 'disabled'}>
                                </div>
                                <div class="ship-stat-group">
                                    <label class="ship-stat-label">Hull</label>
                                    <input type="text" class="ship-equipment-input ship-slot-input"
                                           placeholder="Item..." value="${ship.hull || ''}"
                                           data-slot="${i}" data-field="hull"
                                           ${ship.ship_name && ship.ship_name.trim() !== '' ? '' : 'disabled'}>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            $('#ship-slots-container').html(html);
            
            // Add event listener for ship name changes to toggle disabled state
            $('.ship-name-input').off('input').on('input', function() {
                const slot = $(this).data('slot');
                const shipName = $(this).val();
                toggleShipSlotDisabled(slot, shipName && shipName.trim() !== '');
            });
        }

        // Toggle disabled state of ship slot elements based on ship name
        function toggleShipSlotDisabled(slot, isEnabled) {
            const $body = $(`.ship-slot-card[data-slot="${slot}"] .ship-slot-body`);
            const $inputs = $(`.ship-slot-card[data-slot="${slot}"] .ship-equipment-input`);
            
            if (isEnabled) {
                $body.removeClass('disabled');
                $inputs.removeAttr('disabled').css({
                    'opacity': '1',
                    'color': '#e0e0e0',
                    'border-color': '#003361'
                });
            } else {
                $body.addClass('disabled');
                $inputs.attr('disabled', 'disabled').css({
                    'opacity': '0.5',
                    'color': '#6b7280',
                    'border-color': '#1a1a2e'
                });
            }
        }

        // Load application configuration from API
        async function loadAppConfig() {
            showLoading('Loading configuration...');
            try {
                const response = await fetch(`${API_BASE}/api/config`);
                if (response.ok) {
                    const config = await response.json();
                    if (config.success && config.config) {
                        MAX_CAPTAIN_SLOTS = config.config.max_captains || 5;
                        MAX_CREW_SLOTS = config.config.max_crew || 25;
                        CREW_TYPES = config.config.crew_types || CREW_TYPES;
                        
                        // Update UI with dynamic values
                        $('#captains-slot-count').text(MAX_CAPTAIN_SLOTS);
                        $('#crew-slot-count').text(MAX_CREW_SLOTS);
                        
                        console.log('Configuration loaded:', {
                            max_captains: MAX_CAPTAIN_SLOTS,
                            max_crew: MAX_CREW_SLOTS,
                            crew_types_count: CREW_TYPES.length
                        });
                    }
                } else {
                    console.warn('Failed to load config, using defaults');
                }
            } catch (error) {
                console.warn('Error loading config, using defaults:', error.message);
            }
            
            hideLoading();
            checkApiStatus();
            loadRoster();
            setupEventListeners();
            renderShips();
            
            // Refresh status every 5 seconds
            setInterval(checkApiStatus, 5000);
        }

        // Check API connection status
        async function checkApiStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                if (response.ok) {
                    $('#api-status').html('<span class="w-2 h-2 bg-green-400 rounded-full"></span><span class="text-green-400">Connected</span>');
                } else {
                    $('#api-status').html('<span class="w-2 h-2 bg-yellow-400 rounded-full animate-pulse"></span><span class="text-yellow-400">API Error</span>');
                }
            } catch (error) {
                $('#api-status').html('<span class="w-2 h-2 bg-red-400 rounded-full"></span><span class="text-red-400">Disconnected</span>');
            }
        }

        // Load roster data
        async function loadRoster() {
            showLoading('Loading roster...');
            try {
                const response = await fetch(`${API_BASE}/api/roster`);
                if (response.ok) {
                    const responseData = await response.json();
                    if (responseData.success && responseData.roster) {
                        rosterData = responseData.roster;
                    } else {
                        rosterData = { captains: [], crew: [], ships: [] };
                    }
                    renderCaptains();
                    renderCrew();
                } else {
                    showToast('Failed to load roster', 'error');
                }
            } catch (error) {
                showToast('Error loading roster: ' + error.message, 'error');
            }
            hideLoading();
        }

        // Current traits modal state
        let currentTraitsCaptainIndex = null;
        
        // Render captains list with dynamic slots
        function renderCaptains() {
            let html = '';
            
            for (let i = 0; i < MAX_CAPTAIN_SLOTS; i++) {
                const captain = rosterData.captains[i] || {
                    name: '',
                    level: 1,
                    stats: {
                        morale: '',
                        combat: '',
                        seafaring: ''
                    },
                    traits: []
                };

                html += `
                    <div class="captain-card" data-index="${i}" data-traits='${JSON.stringify(captain.traits || [])}'>
                        <!-- Top Row: Name Entry + Traits Button -->
                        <div class="captain-top-row">
                            <input type="text" class="captain-name-input"
                                   placeholder="Captain Name" value="${captain.name || ''}"
                                   data-index="${i}" data-field="name">
                            <button class="traits-btn" data-index="${i}" type="button">
                                Traits
                            </button>
                        </div>
                        
                        <!-- Bottom Row: Stats -->
                        <div class="captain-stats-column">
                            <div class="captain-stat-row">
                                <label class="captain-stat-label">M:</label>
                                <div class="captain-stat-input-wrapper">
                                    <input type="text" class="captain-stat-input"
                                           value="${captain.stats.morale || ''}" placeholder="0"
                                           data-index="${i}" data-field="morale">
                                    <span class="trait-indicator trait-morale"></span>
                                </div>
                            </div>
                            <div class="captain-stat-row">
                                <label class="captain-stat-label">C:</label>
                                <div class="captain-stat-input-wrapper">
                                    <input type="text" class="captain-stat-input"
                                           value="${captain.stats.combat || ''}" placeholder="0"
                                           data-index="${i}" data-field="combat">
                                    <span class="trait-indicator trait-combat"></span>
                                </div>
                            </div>
                            <div class="captain-stat-row">
                                <label class="captain-stat-label">S:</label>
                                <div class="captain-stat-input-wrapper">
                                    <input type="text" class="captain-stat-input"
                                           value="${captain.stats.seafaring || ''}" placeholder="0"
                                           data-index="${i}" data-field="seafaring">
                                    <span class="trait-indicator trait-seafaring"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            
            $('#captains-list').html(html);
            
            // Update trait indicators for all captains with traits
            rosterData.captains.forEach((captain, index) => {
                if (captain.traits && captain.traits.length > 0) {
                    updateTraitIndicators(index, captain.traits);
                }
            });
            
            // Make captains list sortable for drag-and-drop reordering
            makeCaptainsSortable();
        }

        // Initialize jQuery UI sortable for captains
        function makeCaptainsSortable() {
            // Destroy existing sortable if it exists to prevent duplicates
            if ($('#captains-list').hasClass('ui-sortable')) {
                $('#captains-list').sortable('destroy');
            }
            
            $('#captains-list').sortable({
                items: '> .captain-card',
                handle: '.captain-card', // Drag by the entire card
                placeholder: 'captain-card placeholder-shim',
                cursor: 'grabbing',
                tolerance: 'pointer',
                revert: 50,
                start: function(event, ui) {
                    // Add a class to indicate dragging for cursor changes
                    $('#captains-list').addClass('dragging');
                },
                stop: function(event, ui) {
                    // Remove the dragging class
                    $('#captains-list').removeClass('dragging');
                    // Gather data in the new order before re-rendering
                    gatherRosterData();
                },
                update: function(event, ui) {
                    // Re-render captains after sort to update indices
                    renderCaptains();
                }
            }).disableSelection();
        }

        // Render crew list with dynamic slots and crew types from API
        function renderCrew() {
            let html = '';

            for (let i = 0; i < MAX_CREW_SLOTS; i++) {
                const crewMember = rosterData.crew[i] || {
                    type: CREW_TYPES[i % CREW_TYPES.length],
                    level: 1,
                    stats: {
                        morale: '',
                        combat: '',
                        seafaring: ''
                    }
                };

                html += `
                    <div class="crew-card card">
                        <div class="card-grid-2 mb-2">
                            <div>
                                <select class="crew-type-input card-input bg-navy-800 border border-navy-600 rounded px-2 py-1 text-gray-100 text-sm focus:outline-none focus:border-cyan-500"
                                        data-index="${i}" data-field="type">
                                    ${CREW_TYPES.map(type => `<option value="${type}" ${crewMember.type === type ? 'selected' : ''}>${type}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="card-label">Level</label>
                                <div class="level-control">
                                    <span class="level-label">Lvl</span>
                                    <button type="button" class="level-up-btn" data-index="${i}">L+</button>
                                </div>
                            </div>
                        </div>
                        <div class="crew-stats-grid">
                            <div>
                                <label class="card-label">Morale</label>
                                <input type="text" class="crew-stat-input card-input bg-navy-800 border border-navy-600 rounded px-2 py-1 text-gray-100 text-sm focus:outline-none focus:border-cyan-500"
                                       value="${crewMember.stats.morale || ''}" placeholder="0" data-index="${i}" data-field="morale">
                            </div>
                            <div>
                                <label class="card-label">Combat</label>
                                <input type="text" class="crew-stat-input card-input bg-navy-800 border border-navy-600 rounded px-2 py-1 text-gray-100 text-sm focus:outline-none focus:border-cyan-500"
                                       value="${crewMember.stats.combat || ''}" placeholder="0" data-index="${i}" data-field="combat">
                            </div>
                            <div>
                                <label class="card-label">Seafaring</label>
                                <input type="text" class="crew-stat-input card-input bg-navy-800 border border-navy-600 rounded px-2 py-1 text-gray-100 text-sm focus:outline-none focus:border-cyan-500"
                                       value="${crewMember.stats.seafaring || ''}" placeholder="0" data-index="${i}" data-field="seafaring">
                            </div>
                        </div>
                    </div>
                `;
            }
            
            $('#crew-list').html(html);
        }

        // Setup event listeners
        function setupEventListeners() {
            // Refresh button
            $('#btn-refresh').click(function() {
                loadRoster();
                checkApiStatus();
            });

            // Save roster
            $('#btn-save-roster').click(function() {
                gatherRosterData();
                saveRoster();
            });

            // Load roster
            $('#btn-load-roster').click(function() {
                $('#file-input').trigger('click');
            });

            // Hidden file input
            $('<input type="file" id="file-input" accept=".json" class="hidden">').appendTo('body');
            $('#file-input').change(function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        try {
                            const data = JSON.parse(e.target.result);
                            rosterData = data;
                            renderCaptains();
                            renderCrew();
                            showToast('Roster loaded successfully', 'success');
                        } catch (error) {
                            showToast('Error loading roster: Invalid JSON', 'error');
                        }
                    };
                    reader.readAsText(file);
                }
            });

            // Optimize button
            $('#btn-optimize').click(function() {
                runOptimization();
            });

            // Gather data from captain inputs on change
            $(document).on('input', '.captain-name-input, .captain-stat-input', function() {
                // Auto-gather data for real-time updates
                gatherRosterData();
            });

            // Gather data from crew inputs on change
            $(document).on('input', '.crew-stat-input, .crew-type-input', function() {
                // Auto-gather data for real-time updates
                gatherRosterData();
            });

            // Level up button click (no functionality yet, as per requirements)
            $(document).on('click', '.level-up-btn', function(e) {
                e.preventDefault();
                // Placeholder for future level-up functionality
                console.log('Level up button clicked for crew index:', $(this).data('index'));
            });

            // Traits button click
            $(document).on('click', '.traits-btn', function(e) {
                e.stopPropagation();
                const captainIndex = $(this).data('index');
                openTraitsModal(captainIndex);
            });

            // Traits modal close button
            $('.modal-close').click(function() {
                closeTraitsModal();
            });

            // Traits modal save button
            $('#traits-save-btn').click(function() {
                saveTraitsFromModal();
            });

            // Close modal on overlay click
            $('#traits-modal').click(function(e) {
                if (e.target === this) {
                    closeTraitsModal();
                }
            });

            // Loading overlay click prevention
            $('#loading-overlay').click(function(e) {
                if (e.target === this) {
                    return false;
                }
            });
        }

        // Gather roster data from all inputs
        function gatherRosterData() {
            const captains = [];
            const crew = [];

            // Gather captain data - iterate through DOM elements in visual order
            // This ensures drag-and-drop reordering is respected
            $('#captains-list .captain-card').each(function() {
                const $card = $(this);
                const nameInput = $card.find('.captain-name-input');
                const moraleInput = $card.find('.captain-stat-input[data-field="morale"]');
                const combatInput = $card.find('.captain-stat-input[data-field="combat"]');
                const seafaringInput = $card.find('.captain-stat-input[data-field="seafaring"]');

                const name = nameInput.val();
                // Only add captain if name is filled
                if (name && name.trim() !== '') {
                    captains.push({
                        name: name.trim(),
                        stats: {
                            morale: parseInt(moraleInput.val()) || 0,
                            combat: parseInt(combatInput.val()) || 0,
                            seafaring: parseInt(seafaringInput.val()) || 0
                        },
                        traits: $card.data('traits') || []
                    });
                }
            });

            // Gather crew data
            for (let i = 0; i < MAX_CREW_SLOTS; i++) {
                const typeInput = $(`.crew-type-input[data-index="${i}"]`);
                const moraleInput = $(`.crew-stat-input[data-index="${i}"][data-field="morale"]`);
                const combatInput = $(`.crew-stat-input[data-index="${i}"][data-field="combat"]`);
                const seafaringInput = $(`.crew-stat-input[data-index="${i}"][data-field="seafaring"]`);

                // Add crew regardless of name (crew no longer have names)
                crew.push({
                    type: typeInput.val() || '',
                    level: 1,
                    stats: {
                        morale: parseInt(moraleInput.val()) || 0,
                        combat: parseInt(combatInput.val()) || 0,
                        seafaring: parseInt(seafaringInput.val()) || 0
                    }
                });
            }

            rosterData.captains = captains;
            rosterData.crew = crew;
        }

        // Save roster to file
        async function saveRoster() {
            gatherRosterData();
            showLoading('Saving roster...');
            try {
                const response = await fetch(`${API_BASE}/api/roster`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(rosterData)
                });
                if (response.ok) {
                    showToast('Roster saved successfully', 'success');
                } else {
                    showToast('Failed to save roster', 'error');
                }
            } catch (error) {
                showToast('Error saving roster: ' + error.message, 'error');
            }
            hideLoading();
        }

        // Run optimization
        async function runOptimization() {
            gatherRosterData();
            
            const targets = {
                morale: parseInt($('#morale-target').val()) || 0,
                combat: parseInt($('#combat-target').val()) || 0,
                seafaring: parseInt($('#seafaring-target').val()) || 0
            };

            if (targets.morale === 0 && targets.combat === 0 && targets.seafaring === 0) {
                showToast('Please enter at least one voyage target', 'error');
                return;
            }

            if (rosterData.captains.length === 0) {
                showToast('No captains available (fill in at least one captain name)', 'error');
                return;
            }

            if (rosterData.crew.length === 0) {
                showToast('No crew members available (fill in at least one crew name)', 'error');
                return;
            }

            showLoading('Running optimization...');

            try {
                const response = await fetch(`${API_BASE}/api/optimize`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        targets: targets,
                        captains: rosterData.captains,
                        crew: rosterData.crew,
                        max_results: 10
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    optimizationResults = result.results || [];
                    renderResults();
                    showToast(`Found ${optimizationResults.length} results`, 'success');
                } else {
                    const error = await response.json();
                    showToast('Optimization failed: ' + (error.error || 'Unknown error'), 'error');
                }
            } catch (error) {
                showToast('Error running optimization: ' + error.message, 'error');
            }

            hideLoading();
        }

        // Render optimization results
        function renderResults() {
            if (optimizationResults.length === 0) {
                $('#results-list').html('<div class="text-center text-gray-400 py-8"><p>No valid assignments found</p></div>');
                $('#result-count').text('0 results');
                return;
            }

            $('#result-count').text(`${optimizationResults.length} results`);

            let html = '<div class="space-y-4">';
            optimizationResults.forEach((result, index) => {
                html += `
                    <div class="result-card">
                        <div class="result-top">
                            <div>
                                <h3 class="result-title">Assignment #${index + 1}</h3>
                                <p class="text-sm text-gray-400">Score: <span class="result-score">${result.score.toFixed(2)}</span></p>
                            </div>
                            <span class="result-badge ${result.meets_targets ? 'meets' : 'partial'}">
                                ${result.meets_targets ? 'Meets Targets' : 'Partial'}
                            </span>
                        </div>
                        <div class="mb-3">
                            <p class="text-sm text-gray-400 mb-1">Captain: <span class="text-gray-100 font-medium">${result.assignment.captain_name}</span></p>
                            <div class="result-stats">
                                <div><span class="result-stat-label">Morale:</span> <span class="text-gray-100">${result.final_stats.morale}</span></div>
                                <div><span class="result-stat-label">Navigation:</span> <span class="text-gray-100">${result.final_stats.navigation}</span></div>
                                <div><span class="result-stat-label">Engineering:</span> <span class="text-gray-100">${result.final_stats.engineering}</span></div>
                                <div><span class="result-stat-label">Medical:</span> <span class="text-gray-100">${result.final_stats.medical}</span></div>
                                <div><span class="result-stat-label">Defense:</span> <span class="text-gray-100">${result.final_stats.defense}</span></div>
                            </div>
                        </div>
                        <div class="result-crew-section">
                            <p class="result-crew-label">Crew (${result.assignment.crew_names.length} members):</p>
                            <div class="result-crew-tags">
                                ${result.assignment.crew_names.map(name => `<span class="crew-tag">${name}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            $('#results-list').html(html);
        }

        // Open traits modal for a captain
        function openTraitsModal(captainIndex) {
            currentTraitsCaptainIndex = captainIndex;
            const captain = rosterData.captains[captainIndex];
            const traits = captain ? captain.traits : [];
            
            // Reset all dropdowns to None, then set the traits
            $('.traits-dropdown-select').val('');
            
            // Set the first four traits (if any) to their respective dropdowns
            for (let i = 0; i < Math.min(traits.length, 4); i++) {
                $(`.traits-dropdown-select[data-slot="${i}"]`).val(traits[i]);
            }
            
            // Show the modal
            $('#traits-modal').removeClass('hidden').addClass('active');
        }
        
        // Close traits modal
        function closeTraitsModal() {
            $('#traits-modal').removeClass('active').addClass('hidden');
            currentTraitsCaptainIndex = null;
        }
        
        // Save traits from modal
        function saveTraitsFromModal() {
            if (currentTraitsCaptainIndex === null) return;
            
            // Collect non-empty traits from the dropdowns
            const selectedTraits = [];
            $('.traits-dropdown-select').each(function() {
                const val = $(this).val();
                if (val && val.trim() !== '') {
                    selectedTraits.push(val);
                }
            });
            
            // Update roster data
            if (!rosterData.captains[currentTraitsCaptainIndex]) {
                rosterData.captains[currentTraitsCaptainIndex] = { name: '', stats: {}, traits: [] };
            }
            rosterData.captains[currentTraitsCaptainIndex].traits = selectedTraits;
            
            // Update trait indicators on the card and store in data attribute
            const $card = $(`.captain-card[data-index="${currentTraitsCaptainIndex}"]`);
            $card.data('traits', selectedTraits);
            updateTraitIndicators(currentTraitsCaptainIndex, selectedTraits);
            
            closeTraitsModal();
        }
        
        // Update trait indicators on captain card
        function updateTraitIndicators(captainIndex, traits) {
            const $card = $(`.captain-card[data-index="${captainIndex}"]`);
            
            // Clear all indicators
            $card.find('.trait-indicator').html('');
            
            // Add green + for active traits
            if (traits.includes('Leader')) {
                $card.find('.trait-morale').html('<span class="trait-plus">+</span>');
            }
            if (traits.includes('Tactician')) {
                $card.find('.trait-combat').html('<span class="trait-plus">+</span>');
            }
            if (traits.includes('Seafriend')) {
                $card.find('.trait-seafaring').html('<span class="trait-plus">+</span>');
            }
        }

        // Show loading overlay
        function showLoading(text = 'Processing...') {
            $('#loading-text').text(text);
            $('#loading-overlay').removeClass('hidden').addClass('active');
        }

        // Hide loading overlay
        function hideLoading() {
            $('#loading-overlay').removeClass('active').addClass('hidden');
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const icons = {
                success: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>',
                error: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>',
                info: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>',
                warning: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>'
            };

            const toast = $(`
                <div class="toast ${type} animate-slide-up">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        ${icons[type]}
                    </svg>
                    <p>${message}</p>
                </div>
            `);

            $('#toast-container').append(toast);

            setTimeout(() => {
                toast.fadeOut(300, function() {
                    $(this).remove();
                });
            }, 3000);
        }
    </script>
</body>
</html>
